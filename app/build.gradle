plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simpleweather.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.simpleweather.app'
        minSdk 24
        targetSdk 33
        versionCode 111
        versionName '9.88'
    }

    signingConfigs {
        release {
            if (System.getenv('SIGNING_KEYSTORE') != null) {
                storeFile file(System.getenv('SIGNING_KEYSTORE'))
                storePassword System.getenv('SIGNING_KEYSTORE_PASS')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASS')
            }
            // v9.90：与 v9.87（apksigner 手工签名）对齐——显式开启 v2+v3 签名方案
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            // v9.90：开 R8 裁剪 + 资源收缩（Compose 库自带 consumer 规则）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('SIGNING_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {

    // 纯 Java 实现，无第三方运行时依赖

}