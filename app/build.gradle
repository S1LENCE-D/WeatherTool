plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simpleweather.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.simpleweather.app'
        minSdk 24
        targetSdk 33
        versionCode 115
        versionName '9.88.3'
    }

    signingConfigs {
        release {
            // v9.88：Actions 未配置 secrets 时 env 为空串（非 null），需判非空
            // 否则 file('') 抛 Cannot convert '' to File，导致 CI 构建失败
            String ks = System.getenv('SIGNING_KEYSTORE')
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_KEYSTORE_PASS')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASS')
            }
            // v9.90：与 v9.87（apksigner 手工签名）对齐——显式开启 v2+v3 签名方案
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            // v9.90：开 R8 裁剪 + 资源收缩（Compose 库自带 consumer 规则）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            String ks2 = System.getenv('SIGNING_KEYSTORE')
            if (ks2 != null && !ks2.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {

    // 纯 Java 实现，无第三方运行时依赖

}