plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}

android {
    namespace 'com.simpleweather.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.simpleweather.app'
        minSdk 24
        targetSdk 33
        versionCode 100
        versionName '9.88'
    }

    signingConfigs {
        release {
            if (System.getenv('SIGNING_KEYSTORE') != null) {
                storeFile file(System.getenv('SIGNING_KEYSTORE'))
                storePassword System.getenv('SIGNING_KEYSTORE_PASS')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASS')
            }
            // v9.90：与 v9.87（apksigner 手工签名）对齐——显式开启 v2+v3 签名方案
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        release {
            // v9.90：开 R8 裁剪 + 资源收缩（Compose 库自带 consumer 规则）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv('SIGNING_KEYSTORE') != null) {
                signingConfig signingConfigs.release
            }
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    buildFeatures {
        compose true
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // Compose 基础（BOM 统一版本）
    def composeBom = platform('androidx.compose:compose-bom:2026.01.01')
    implementation composeBom
    implementation 'androidx.activity:activity-compose:1.9.3'
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    // v9.90：仅用 Icons.Default 基础图标（Refresh/Settings 均在 core 子集内），不背 extended 全家桶
    implementation 'androidx.compose.material:material-icons-core'


    // 现有 Java 逻辑层复用（无第三方依赖）
}
