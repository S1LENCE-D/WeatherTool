plugins {
    id 'com.android.application'
}

android {
    namespace 'com.simpleweather.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.simpleweather.app'
        minSdk 24
        targetSdk 33
        // v10.1 的第二次构建（同一版本名，覆盖发布）：版本码递增，保证安装器当作升级
        versionCode 152
        versionName '10.1'
    }

    /**
     * 两个发行版本（applicationId 相同，按系统版本择一安装）：
     *   full —— 含 Smartspacer 插件 SDK；该 SDK 要求 API 29，故本版本 minSdk 29
     *   lite —— 不含任何第三方 SDK，维持 minSdk 24（Android 7.0 起可用）
     */
    flavorDimensions 'sdk'
    productFlavors {
        full { dimension 'sdk'; minSdk 29 }
        lite { dimension 'sdk'; minSdk 24 }
    }

    signingConfigs {
        release {
            // v9.88：Actions 未配置 secrets 时 env 为空串（非 null），需判非空
            // 否则 file('') 抛 Cannot convert '' to File，导致 CI 构建失败
            String ks = System.getenv('SIGNING_KEYSTORE')
            if (ks != null && !ks.isEmpty()) {
                storeFile file(ks)
                storePassword System.getenv('SIGNING_KEYSTORE_PASS')
                keyAlias System.getenv('SIGNING_KEY_ALIAS')
                keyPassword System.getenv('SIGNING_KEY_PASS')
            }
            // 显式开启 v2+v3 签名方案（与历史 apksigner 手工签名产物一致）
            enableV2Signing true
            enableV3Signing true
        }
    }

    buildTypes {
        // v10.1：测试包版本号与正式版解绑 —— debug 产物自带 -test 后缀，便于区分
        debug {
            versionNameSuffix '-test'
        }
        release {
            // R8 裁剪 + 资源收缩（纯 Java 工程，混淆规则见 app/proguard-rules.pro）
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            String ks2 = System.getenv('SIGNING_KEYSTORE')
            if (ks2 != null && !ks2.isEmpty()) {
                signingConfig signingConfigs.release
            }
        }
    }


    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            java.srcDirs = ['src/main/java']
        }
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // 仅 full 版引入：lite 版保持零第三方运行时依赖
    fullImplementation 'com.kieronquinn.smartspacer:sdk-plugin:1.1.2'

    // lite 版无任何第三方运行时依赖；full 版见上方

}