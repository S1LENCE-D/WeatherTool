<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=3.0, user-scalable=yes">
<title>view</title>
<style>
html,body{margin:0;padding:0;height:100%;background:#081018;overflow:hidden}
#wrap{position:relative;width:100%;height:100%}
#img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:contain}
#tip{position:absolute;top:10px;left:10px;color:#d5e5ff;font:12px/1.6 sans-serif;
     background:rgba(0,0,0,.55);padding:4px 10px;border-radius:6px;pointer-events:none;max-width:86%}
#load{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
      color:#9fb8d8;font:13px sans-serif;background:rgba(0,0,0,.55);padding:8px 14px;border-radius:8px;display:none}
</style>
</head>
<body>
<div id="wrap">
  <img id="img" alt="">
  <div id="tip">正在加载…</div>
  <div id="load">正在获取最新数据…</div>
</div>
<script>
var q = new URLSearchParams(location.search);
var type = (q.get('type') || 'rain');
var img = document.getElementById('img');
var tip = document.getElementById('tip');
var load = document.getElementById('load');

function pad(n){ return (n < 10 ? '0' : '') + n; }

/* 取帧时间：rain=6分钟整，cloud=整点（UTC） */
function snap(){
  var d = new Date();
  d.setUTCSeconds(0); d.setUTCMilliseconds(0);
  if (type == 'rain') d.setUTCMinutes(Math.floor(d.getUTCMinutes() / 6) * 6);
  else d.setUTCMinutes(0);
  return d;
}

/* 中央气象台产品 URL（RDCP 降雨实况 / WXBL 风云二号红外云图） */
function urlOf(d){
  var y = d.getUTCFullYear(), mo = pad(d.getUTCMonth()+1), da = pad(d.getUTCDate());
  var h = pad(d.getUTCHours()), mi = pad(d.getUTCMinutes());
  var base = 'https://image.nmc.cn/product/' + y + '/' + mo + '/' + da + '/';
  if (type == 'rain') {
    return base + 'RDCP/medium/SEVP_AOC_RDCP_SLDAS3_ECREF_ACHN_L88_PI_'
         + y + mo + da + h + mi + '00000.PNG?v=' + Date.now();
  }
  return base + 'WXBL/medium/SEVP_NSMC_WXBL_FY2G_ECN_ACHN_LNO_PY_'
       + y + mo + da + h + '0000000.JPG?v=' + Date.now();
}

/* UTC -> 北京时间 HH:MM */
function bjt(d){
  var t = new Date(d.getTime() + 8*3600*1000);
  return pad(t.getUTCHours()) + ':' + pad(t.getUTCMinutes());
}

var cur = snap();
var maxTry = (type == 'rain' ? 20 : 10);   // 回退次数：2小时 / 10小时
var step = (type == 'rain' ? 6 : 60);      // 回退步长：分钟

function loadFrame(){
  var d = cur;
  load.style.display = 'block';
  img.onload = function(){
    load.style.display = 'none';
    tip.textContent = '中央气象台 · ' + (type == 'rain' ? '降雨实况' : '红外云图')
                    + ' · ' + bjt(d);
    try { AndroidBridge.onFrame(bjt(d)); } catch(e){}
  };
  img.onerror = function(){
    if (maxTry-- > 0) {
      cur = new Date(cur.getTime() - step*60000);
      img.src = urlOf(cur);
    } else {
      load.style.display = 'none';
      tip.textContent = '图源暂不可用，请检查网络';
      try { AndroidBridge.onFrame('--:--'); } catch(e){}
    }
  };
  img.src = urlOf(d);
}

loadFrame();
/* 每 2 分钟自动刷新到最新帧 */
setInterval(function(){
  cur = snap();
  maxTry = (type == 'rain' ? 20 : 10);
  loadFrame();
}, 120000);
</script>
</body>
</html>
