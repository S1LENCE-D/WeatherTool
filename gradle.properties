# JVM 内存与编码
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
# R 类仅包含本模块资源，加快构建
android.nonTransitiveRClass=true

# 纯 Java + 框架 View 工程，当前无 AndroidX 依赖；保留该开关以便将来引入
android.useAndroidX=true
# compileSdk 37 需显式放行（AGP 对未列入默认支持范围的 SDK 版本会告警）
android.suppressUnsupportedCompileSdk=37,37.0

# ARM64 主机：Google 的 aapt2/zipalign 仅提供 x86_64，覆盖为社区交叉编译的 arm64 版
# （Commit451/android-arm-build-tools，AOSP platform-tools-37.0.0 源码构建）
# CI(x86_64) 由 release.yml 预建软链指向官方 aapt2，兼容此路径
android.aapt2FromMavenOverride=/opt/android-sdk/build-tools/arm64-37.0.0/aapt2
android.zipalignFromMavenOverride=/opt/android-sdk/build-tools/arm64-37.0.0/zipalign
